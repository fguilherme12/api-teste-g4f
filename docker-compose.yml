services:
  database:
    image: postgres:15
    container_name: teste_g4f_postgres
    environment:
      POSTGRES_USER: testeg4f
      POSTGRES_PASSWORD: testeg4f
      POSTGRES_DB: testeg4f
    healthcheck: 
      interval: 10s
      retries: 10
      test: "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""
      timeout: 2s
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

