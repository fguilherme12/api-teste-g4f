services:
  database:
    image: postgres:15-alpine
    container_name: teste_g4f_postgres
    environment:
      POSTGRES_USER: testeg4f
      POSTGRES_PASSWORD: testeg4f
      POSTGRES_DB: testeg4f
    healthcheck: 
      interval: 10s
      retries: 10
      test: "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
      timeout: 2s
      start_period: 10s
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - g4f-network
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teste_g4f_api
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://testeg4f:testeg4f@database:5432/testeg4f
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - PORT=3000
      - SEED_USER_EMAIL=${SEED_USER_EMAIL:-admin@test.com}
      - SEED_USER_PASSWORD=${SEED_USER_PASSWORD:-admin123}
    ports:
      - '3000:3000'
    depends_on:
      database:
        condition: service_healthy
    networks:
      - g4f-network
    restart: unless-stopped
    command: sh -c "npx prisma db push --schema=src/database/schema.prisma --skip-generate && npx ts-node prisma/seed.ts && node dist/src/main"

volumes:
  postgres_data:
    driver: local

networks:
  g4f-network:
    driver: bridge
